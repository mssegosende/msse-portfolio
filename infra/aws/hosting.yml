AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  msse portfolio: the static site on a private S3 bucket behind CloudFront, and
  the role GitHub Actions assumes (OIDC, no stored keys) to publish it.

Parameters:
  GitHubRepo:
    Type: String
    Description: The repository allowed to deploy, as owner/name.
    AllowedPattern: "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
  GitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: >-
      ARN of an existing token.actions.githubusercontent.com identity provider.
      Leave empty to create one; an account can hold only one.

Conditions:
  CreateOidcProvider: !Equals [!Ref GitHubOidcProviderArn, ""]

Resources:
  # Private: only this distribution can read it (see SiteBucketPolicy).
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref AWS::StackName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        # All edge locations: visitors can be anywhere, and at this traffic the
        # cheaper classes save nothing.
        PriceClass: PriceClass_All
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized: honours the Cache-Control the deploy sets.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-SecurityHeadersPolicy: HSTS, nosniff, frame and referrer policies.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Only workflows running on main of GitHubRepo can assume it, and it can only
  # write this bucket and invalidate this distribution.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitHub Actions on main to publish the site.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: publish-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

# Each of these but SiteUrl goes into a GitHub repository variable (see README).
Outputs:
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  BucketName:
    Description: AWS_SITE_BUCKET
    Value: !Ref SiteBucket
  DistributionId:
    Description: AWS_CLOUDFRONT_DISTRIBUTION_ID
    Value: !Ref Distribution
  DeployRoleArn:
    Description: AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
