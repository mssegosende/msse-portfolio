<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#ffffff" />
        <meta name="description" content="María Sol Gosende — Full Stack Developer & AI Engineer. Intelligent systems, engineered beautifully." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <!--
        Applied before first paint so a stored dark choice never shows a
        white flash. Kept inline and dependency-free for that reason; React
        takes over the attribute once it mounts.
        -->
        <script>
            (function () {
                // ScrollTrigger captures history.scrollRestoration when it
                // builds, and restores that value afterwards. A React effect
                // runs AFTER the child's layout effect has already created the
                // trigger, so setting it there is captured as "auto" and put
                // straight back. It has to happen before any of that, which
                // means here — otherwise a reload drops the visitor into the
                // middle of the pinned sequence, on scene 2.
                try {
                    if ('scrollRestoration' in window.history) {
                        window.history.scrollRestoration = 'manual';
                    }
                    window.scrollTo(0, 0);
                } catch (e) {}
                try {
                    if (localStorage.getItem('msgc-theme') === 'dark') {
                        document.documentElement.setAttribute('data-theme', 'dark');
                        var m = document.querySelector('meta[name="theme-color"]');
                        if (m) m.setAttribute('content', '#000000');
                    }
                } catch (e) {}
            })();
        </script>
        <title>MSGCENGINEER — María Sol Gosende, Full Stack Developer & AI Engineer</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

</html>
