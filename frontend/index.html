    <!-- One request for every face the site renders (checked against the
         computed styles of the whole page, desktop and phone, both themes).
         JetBrains Mono 500 is the face its 600 text is drawn from. VT323 and
         Inter 200 are the CRT redesign's (HUD labels; BUILD THE FUTURE).
         Rajdhani and Science Gothic go once nothing uses them. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600&family=JetBrains+Mono:wght@400;500&family=Michroma&family=Rajdhani:wght@300;400;600&family=Science+Gothic:wdth,wght@150,200&family=VT323&display=swap"
      rel="stylesheet"
    />
    <!--
        Disable the browser's scroll restoration before anything else runs: a
        reload would otherwise land in the middle of the pinned sequence, and a
        React effect is too late (ScrollTrigger captures the value when built).
        -->
    <script>
      (function () {
        try {
          if ("scrollRestoration" in window.history) {
            window.history.scrollRestoration = "manual";
          }
          window.scrollTo(0, 0);
        } catch (e) {}
      })();
    </script>
    <!-- The tab says MSSE:// on every view, and nothing changes it. -->
    <title>MSSE://</title>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      The loading screen (María Sol, 13 Nov): inline, so it paints before any
      bundle or web font. Shown only if loading takes more than ~300 ms. The
      percentage is real: each stage that blocks scene 1 reports here
      (window.__msseBoot, src/lib/boot.ts). At 100% it asks how to enter
      (with sound or silent) unless a choice is saved, then fades out.
    -->
    <style>
      #boot {
        --boot-bg: #020409;
        --boot-ph: #7dc6f6;
        --boot-tx: #c8ecfe;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        transition: opacity 0.7s cubic-bezier(0.25, 0.6, 0.2, 1);
      }
      html:not([data-theme="dark"]) #boot {
        --boot-bg: #eaeff5;
        --boot-ph: #1f5faf;
        --boot-tx: #193755;
      }
      #boot.is-out {
        opacity: 0;
        pointer-events: none;
      }
      .boot__face {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg);
        color: var(--boot-tx);
        font-family: VT323, ui-monospace, "Cascadia Mono", Consolas, monospace;
        opacity: 0;
        animation: boot-in 0.2s linear 0.3s forwards;
      }
      #boot.is-shown .boot__face {
        animation: none;
        opacity: 1;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      .boot__mark {
        width: 44px;
        height: 44px;
      }
      .boot__mark path {
        fill: none;
        stroke: var(--boot-tx);
        stroke-width: 2.4;
      }
      .boot__mark .boot__s {
        fill: var(--boot-tx);
        stroke: none;
      }
      .boot__label,
      .boot__choice button {
        font: inherit;
        font-size: 22px;
        letter-spacing: 0.14em;
        color: var(--boot-tx);
      }
      .boot__label {
        margin: 18px 0 12px;
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      .boot__choice {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px 16px;
        margin: 18px 0 12px;
      }
      .boot__choice[hidden],
      .boot__label[hidden] {
        display: none;
      }
      .boot__choice button {
        min-height: 44px;
        padding: 0 10px;
        background: none;
        border: 0;
        cursor: pointer;
      }
      .boot__choice button:hover {
        color: var(--boot-ph);
      }
      .boot__choice button:focus-visible {
        outline: 2px solid var(--boot-tx);
        outline-offset: 2px;
      }
      .boot__frame {
        position: relative;
        padding: 6px;
      }
      .boot__frame > b {
        position: absolute;
        width: 8px;
        height: 8px;
        border: 0 solid var(--boot-tx);
      }
      .boot__frame > b:nth-child(1) {
        top: 0;
        left: 0;
        border-width: 1.5px 0 0 1.5px;
      }
      .boot__frame > b:nth-child(2) {
        top: 0;
        right: 0;
        border-width: 1.5px 1.5px 0 0;
      }
      .boot__frame > b:nth-child(3) {
        bottom: 0;
        left: 0;
        border-width: 0 0 1.5px 1.5px;
      }
      .boot__frame > b:nth-child(4) {
        bottom: 0;
        right: 0;
        border-width: 0 1.5px 1.5px 0;
      }
      .boot__bar {
        display: grid;
        grid-template-columns: repeat(30, 1fr);
        gap: 2px;
        width: min(300px, 72vw);
        height: 12px;
      }
      .boot__bar > i {
        background: var(--boot-ph);
        opacity: 0.18;
        transition: opacity 0.25s;
      }
      .boot__bar > i.on {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__bar > i {
          transition: none;
        }
        #boot {
          transition-duration: 0.3s;
        }
      }
    </style>
    <div id="boot">
      <div class="boot__face">
        <svg class="boot__mark" viewBox="24 24 72 72" aria-hidden="true">
          <path d="M30 44V30H44M76 30H90V44M90 76V90H76M44 90H30V76" />
          <path
            class="boot__s"
            d="M71.92 65.14Q71.92 63.73 71.7 62.92Q71.48 62.11 70.7 61.72Q69.92 61.33 68.29 61.21Q66.65 61.1 63.81 61.05L54.98 60.92Q51.71 60.87 49.73 60.52Q47.74 60.17 46.73 59.42Q45.71 58.67 45.37 57.4Q45.03 56.13 45.03 54.22Q45.03 52.14 45.5 50.79Q45.97 49.44 47.2 48.68Q48.43 47.92 50.68 47.61Q52.94 47.3 56.51 47.3H63.3Q66.54 47.3 68.7 47.51Q70.86 47.71 72.13 48.46Q73.4 49.2 73.95 50.78Q74.49 52.35 74.49 55.09H71.45Q71.45 52.97 71.04 51.88Q70.64 50.79 69.71 50.4Q68.78 50 67.21 49.97Q65.64 49.94 63.3 49.94H56.67Q53.82 49.94 52.12 50.05Q50.41 50.16 49.54 50.55Q48.67 50.95 48.37 51.82Q48.08 52.7 48.08 54.22Q48.08 55.51 48.28 56.29Q48.49 57.06 49.21 57.47Q49.94 57.87 51.44 58.02Q52.95 58.17 55.55 58.21L65.02 58.33Q68.35 58.38 70.34 58.72Q72.33 59.06 73.33 59.83Q74.32 60.59 74.64 61.88Q74.97 63.17 74.97 65.14Q74.97 67.29 74.57 68.74Q74.16 70.19 73 71.06Q71.84 71.94 69.65 72.32Q67.46 72.7 63.89 72.7H56.46Q53.21 72.7 51 72.41Q48.79 72.13 47.48 71.26Q46.17 70.4 45.6 68.68Q45.03 66.97 45.03 64.11H48.08Q48.08 66.35 48.44 67.57Q48.81 68.79 49.72 69.33Q50.63 69.86 52.28 69.96Q53.92 70.06 56.46 70.06H63.73Q66.57 70.06 68.22 69.88Q69.87 69.7 70.67 69.18Q71.46 68.67 71.69 67.7Q71.92 66.73 71.92 65.14Z"
          />
        </svg>
        <p class="boot__label" id="boot-label">
          <span>LOADING...&nbsp;</span><span id="boot-pct">0%</span>
        </p>
        <div class="boot__choice" id="boot-choice" hidden>
          <button type="button" data-enter="sound">[ ENTER WITH SOUND ]</button>
          <button type="button" data-enter="silent">[ ENTER SILENT ]</button>
        </div>
        <div class="boot__frame">
          <b></b><b></b><b></b><b></b>
          <div
            class="boot__bar"
            id="boot-bar"
            role="progressbar"
            aria-label="Loading"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          ></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        // What blocks scene 1, and its share of the bar. A stage that can't
        // report bytes (the Spline scene comes compressed, no length) moves in
        // steps as each part finishes.
        var W = { app: 20, fonts: 10, scene: 45, robot: 20, intro: 5 };
        var KEY = "msse-entry";
        var html = document.documentElement;
        var boot = document.getElementById("boot");
        var bar = document.getElementById("boot-bar");
        var pctEl = document.getElementById("boot-pct");
        var label = document.getElementById("boot-label");
        var choice = document.getElementById("boot-choice");
        var root = document.getElementById("root");
        var done = {};
        var frac = {};
        var shown = 0;
        var ready = false;
        var entered = null;
        var callbacks = [];
        var t0 = performance.now();
        try {
          var reload = JSON.parse(sessionStorage.getItem("theme-reload") || "null");
          if (reload && reload.theme === "light") html.removeAttribute("data-theme");
        } catch (e) {}
        for (var i = 0; i < 30; i++) bar.appendChild(document.createElement("i"));
        var segs = bar.children;
        if (root) {
          root.setAttribute("aria-busy", "true");
          root.inert = true;
        }
        // Nothing scrolls the page behind it.
        var block = function (e) {
          if (!entered && !(e.target && e.target.closest && e.target.closest("#boot-choice")))
            e.preventDefault();
        };
        var keys = { " ": 1, PageDown: 1, PageUp: 1, ArrowDown: 1, ArrowUp: 1, Home: 1, End: 1 };
        var blockKey = function (e) {
          if (keys[e.key] && !(e.target && e.target.closest && e.target.closest("#boot-choice")))
            block(e);
        };
        window.addEventListener("wheel", block, { passive: false, capture: true });
        window.addEventListener("touchmove", block, { passive: false, capture: true });
        window.addEventListener("keydown", blockKey, true);
        var saved = function () {
          try {
            var v = localStorage.getItem(KEY);
            return v === "sound" || v === "silent" ? v : null;
          } catch (e) {
            return null;
          }
        };
        var render = function (p) {
          if (p <= shown) return; // only ever goes up
          shown = p;
          bar.setAttribute("aria-valuenow", String(p));
          pctEl.textContent = p + "%";
          var on = Math.round((p / 100) * 30);
          for (var k = 0; k < 30; k++) segs[k].className = k < on ? "on" : "";
        };
        var update = function () {
          var sum = 0;
          for (var s in W) sum += W[s] * (done[s] ? 1 : Math.min(frac[s] || 0, 0.99));
          // 100 only when every stage is done: never a stuck 99.
          var p = Math.floor(sum + 1e-6);
          if (p >= 100 && !ready) {
            ready = true;
            render(100);
            onReady();
          } else render(Math.min(p, 99));
        };
        var finish = function () {
          window.removeEventListener("wheel", block, true);
          window.removeEventListener("touchmove", block, true);
          window.removeEventListener("keydown", blockKey, true);
          if (root) {
            root.removeAttribute("aria-busy");
            root.inert = false;
          }
          boot.parentNode && boot.parentNode.removeChild(boot);
        };
        var enter = function (mode, gesture) {
          if (entered) return;
          entered = { sound: mode === "sound", gesture: !!gesture };
          html.dataset.boot = "entered";
          for (var c = 0; c < callbacks.length; c++) callbacks[c](entered);
          // Never on screen (a fast, cached load): gone at once.
          if (performance.now() - t0 < 300 && !boot.classList.contains("is-shown")) return finish();
          boot.classList.add("is-out");
          var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          setTimeout(finish, reduce ? 320 : 720);
        };
        var onReady = function () {
          html.dataset.boot = "ready";
          var s = saved();
          if (s) return enter(s, false);
          // A first visit asks, even when it loaded fast.
          boot.classList.add("is-shown");
          label.hidden = true;
          choice.hidden = false;
        };
        choice.addEventListener("click", function (e) {
          var b = e.target && e.target.closest && e.target.closest("button[data-enter]");
          if (!b) return;
          var mode = b.getAttribute("data-enter");
          try {
            localStorage.setItem(KEY, mode);
          } catch (err) {}
          enter(mode, true);
        });
        // The Spline scene: a step when its response arrives, the rest when
        // its body has fully downloaded (per file, while scene 1 waits).
        var started = 0;
        var settled = 0;
        var arrived = 0;
        var sceneStep = function () {
          if (started)
            window.__msseBoot.progress("scene", (arrived * 0.2 + settled * 0.8) / started);
        };
        var origFetch = window.fetch;
        if (origFetch)
          window.fetch = function (input) {
            var p = origFetch.apply(this, arguments);
            var url = typeof input === "string" ? input : (input && input.url) || "";
            if (done.robot || !/\.splinecode(\?|$)/.test(String(url))) return p;
            started++;
            sceneStep();
            return p.then(
              function (res) {
                arrived++;
                sceneStep();
                var count = function () {
                  settled++;
                  sceneStep();
                };
                try {
                  var reader = res.clone().body.getReader();
                  var pump = function () {
                    reader.read().then(function (r) {
                      r.done ? count() : pump();
                    }, count);
                  };
                  pump();
                } catch (e) {
                  count();
                }
                return res;
              },
              function (err) {
                arrived++;
                settled++;
                sceneStep();
                throw err;
              },
            );
          };
        window.__msseBoot = {
          done: function (stage) {
            if (done[stage] || !(stage in W)) return;
            done[stage] = true;
            // The robot shown (or given up on): its scene is in, or never will be.
            if (stage === "robot") done.scene = true;
            update();
          },
          progress: function (stage, f) {
            if (!(stage in W) || done[stage] || f <= (frac[stage] || 0)) return;
            frac[stage] = f;
            update();
          },
          onEnter: function (cb) {
            if (entered) cb(entered);
            else callbacks.push(cb);
          },
          // ?view=sounds (no scene 1): straight in, silent, nothing saved.
          skip: function () {
            ready = true;
            enter("silent", false);
          },
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
