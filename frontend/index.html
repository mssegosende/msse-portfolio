<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="María Sol Gosende, full stack developer and AI engineer from Argentina. Projects, open reference repos and the story behind them."
    />
    <meta property="og:title" content="María Sol Gosende — Software & AI Engineer" />
    <meta
      property="og:description"
      content="María Sol Gosende, full stack developer and AI engineer from Argentina. Projects, open reference repos and the story behind them."
    />
    <meta name="twitter:title" content="María Sol Gosende — Software & AI Engineer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One request for every face the site renders (checked against the
         computed styles of the whole page, desktop and phone, both themes).
         JetBrains Mono 500 is the face its 600 text is drawn from. VT323 and
         Inter 200 are the CRT redesign's (HUD labels; BUILD THE FUTURE).
         Rajdhani and Science Gothic go once nothing uses them. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600&family=JetBrains+Mono:wght@400;500&family=Michroma&family=Rajdhani:wght@300;400;600&family=Science+Gothic:wdth,wght@150,200&family=VT323&display=swap"
      rel="stylesheet"
    />
    <!--
        Disable the browser's scroll restoration before anything else runs: a
        reload would otherwise land in the middle of the pinned sequence, and a
        React effect is too late (ScrollTrigger captures the value when built).
        -->
    <script>
      (function () {
        try {
          if ("scrollRestoration" in window.history) {
            window.history.scrollRestoration = "manual";
          }
          window.scrollTo(0, 0);
        } catch (e) {}
      })();
    </script>
    <title>msse:// Software & AI Engineer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
