<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact · Mobile · Light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;family=Michroma&amp;family=VT323&amp;display=swap">
<style>
body{margin:0;background:#EBF0F5}
a{color:#26425F}
input::placeholder,textarea::placeholder{color:#8092A4}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1420px; overflow: hidden; background: #EBF0F5; color: #26425F; font-family: 'Inter', sans-serif">
  <div aria-hidden="true" style="position: absolute; left: -200px; right: -200px; bottom: -80px; height: 300px; transform: perspective(500px) rotateX(62deg); transform-origin: 50% 100%; background-image: linear-gradient(rgba(31,95,175,0.24) 1px, transparent 1px), linear-gradient(90deg, rgba(31,95,175,0.24) 1px, transparent 1px); background-size: 40px 40px"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 760px; background: linear-gradient(180deg, #EBF0F5 78%, rgba(238,243,248,0))"></div>

  <div aria-hidden="true" style="position: absolute; right: -24px; top: 40px; font-family: 'Michroma', sans-serif; font-size: 120px; line-height: 1; color: rgba(31,95,175,0.04)">TALK</div>
  <div style="position: relative; padding: 56px 20px 0">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="padding: 3px 10px; border: 1px solid rgba(31,95,175,0.44); font-family: 'VT323', monospace; font-size: 17px; letter-spacing: 0.16em; color: #1B3856">05 // CONTACT</span>
      <span style="display: flex; align-items: center; gap: 7px; font-family: 'VT323', monospace; font-size: 17px; letter-spacing: 0.14em; color: #26425F">
        <span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #F472B6; box-shadow: 0 0 10px #F472B6; opacity: {{dot}}"></span>ONLINE
      </span>
    </div>

    <div style="position: relative; margin-top: 26px; padding: 18px 16px 16px">
      <span aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-left: 2px solid #203C5A; border-top: 2px solid #203C5A"></span>
      <span aria-hidden="true" style="position: absolute; right: 0; top: 0; width: 22px; height: 22px; border-right: 2px solid #203C5A; border-top: 2px solid #203C5A"></span>
      <span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 22px; height: 22px; border-left: 2px solid #203C5A; border-bottom: 2px solid #203C5A"></span>
      <span aria-hidden="true" style="position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; border-right: 2px solid #203C5A; border-bottom: 2px solid #203C5A"></span>
      <span style="position: absolute; right: 8px; top: -20px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #203C5A">[signal.rx]</span>
      <div style="position: relative">
        <div aria-hidden="true" style="position: absolute; left: 0; top: 0; transform: translateX({{ga}}px); font-family: 'Michroma', sans-serif; font-size: 58px; line-height: 1.06; letter-spacing: 0.03em; color: rgba(31,95,175,0.28); white-space: pre-line">LET'S
TALK</div>
        <div aria-hidden="true" style="position: absolute; left: 0; top: 0; transform: translateX({{gb}}px); font-family: 'Michroma', sans-serif; font-size: 58px; line-height: 1.06; letter-spacing: 0.03em; color: rgba(31,95,175,0.144); white-space: pre-line">LET'S
TALK</div>
        <h2 style="position: relative; margin: 0; font-family: 'Michroma', sans-serif; font-weight: 400; font-size: 58px; line-height: 1.06; letter-spacing: 0.03em; color: #183654; text-shadow: 0 0 0.6px rgba(20,70,150,0.5), 0 0 14px rgba(31,95,175,0.176); white-space: pre-line">LET'S
TALK</h2>
      </div>
    </div>

    <div style="margin-top: 18px; height: 52px; border: 1px solid rgba(31,95,175,0.224); background-image: linear-gradient(rgba(31,95,175,0.096) 1px, transparent 1px), linear-gradient(90deg, rgba(31,95,175,0.096) 1px, transparent 1px); background-size: 20px 13px">
      <svg aria-hidden="true" width="348" height="50" viewBox="0 0 348 50" style="display: block">
        <path d="{{wave}}" fill="none" stroke="#26425F" stroke-width="1.5" style="filter: drop-shadow(0 0 3px rgba(40,110,220,0.35))"></path>
      </svg>
    </div>
    <div style="margin-top: 6px; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: #5A7087">
      <span>SIGNAL · OPEN</span><span>RX · MSSE://CONTACT</span>
    </div>

    <div style="margin-top: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.7; color: #435B75">
      <div><span style="color: #5A7087">&gt;</span> {{l1}}</div>
      <div><span style="color: #5A7087">&gt;</span> {{l2}}<span aria-hidden="true" style="display: inline-block; width: 8px; height: 14px; margin-left: 2px; vertical-align: -2px; background: #183654; box-shadow: 0 0 10px rgba(40,110,220,0.18); opacity: {{cur}}"></span></div>
    </div>
  </div>

  <form style="position: relative; margin: 26px 20px 0; border: 1px solid rgba(31,95,175,0.44); border-radius: 6px; background: rgba(250,252,255,0.92); overflow: hidden">
    <div style="height: 38px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid rgba(31,95,175,0.4)">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #26425F">msse@contact: ~/new</span>
      <span aria-hidden="true" style="display: flex; gap: 5px">
        <span style="width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #26425F"></span>
        <span style="width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #26425F"></span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #203C5A; box-shadow: 0 0 10px rgba(40,110,220,0.18)"></span>
      </span>
    </div>
    <div style="padding: 18px 16px 6px; display: flex; flex-direction: column; gap: 14px; font-family: 'JetBrains Mono', monospace">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="m-name" style="font-size: 11px; letter-spacing: 0.1em; color: #486079">&gt; NAME</label>
        <input id="m-name" type="text" placeholder="your name" style="height: 44px; box-sizing: border-box; padding: 0 10px; background: transparent; border: none; border-bottom: 1px solid rgba(31,95,175,0.44); color: #163452; font-family: 'JetBrains Mono', monospace; font-size: 15px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="m-email" style="font-size: 11px; letter-spacing: 0.1em; color: #486079">&gt; EMAIL</label>
        <input id="m-email" type="email" placeholder="you@company.com" style="height: 44px; box-sizing: border-box; padding: 0 10px; background: transparent; border: none; border-bottom: 1px solid rgba(31,95,175,0.44); color: #163452; font-family: 'JetBrains Mono', monospace; font-size: 15px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="m-li" style="font-size: 11px; letter-spacing: 0.1em; color: #486079">&gt; LINKEDIN <span style="color: #8092A4">(OPTIONAL)</span></label>
        <input id="m-li" type="url" placeholder="linkedin.com/in/..." style="height: 44px; box-sizing: border-box; padding: 0 10px; background: transparent; border: none; border-bottom: 1px solid rgba(31,95,175,0.44); color: #163452; font-family: 'JetBrains Mono', monospace; font-size: 15px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="m-msg" style="font-size: 11px; letter-spacing: 0.1em; color: #486079">&gt; MESSAGE</label>
        <textarea id="m-msg" rows="4" placeholder="what are you building?" style="box-sizing: border-box; padding: 10px; background: rgba(31,95,175,0.032); border: 1px solid rgba(31,95,175,0.32); color: #163452; font-family: 'JetBrains Mono', monospace; font-size: 15px; line-height: 1.5; resize: none"></textarea>
      </div>
    </div>
    <div style="padding: 12px 16px 18px">
      <button type="submit" style="width: 100%; min-height: 48px; background: #1B3856; border: none; color: #EBF0F5; font-family: 'VT323', monospace; font-size: 24px; letter-spacing: 0.16em; box-shadow: 0 0 10px rgba(40,110,220,0.18)">SEND &gt;&gt;</button>
    </div>
  </form>

  <div style="position: relative; margin: 22px 20px 0; border: 1px solid rgba(31,95,175,0.4); background: rgba(250,252,255,0.88)">
    <span aria-hidden="true" style="position: absolute; left: -4px; top: -4px; width: 7px; height: 7px; border-radius: 50%; background: #203C5A; box-shadow: 0 0 10px rgba(40,110,220,0.18)"></span>
    <span aria-hidden="true" style="position: absolute; right: -4px; top: -4px; width: 7px; height: 7px; border-radius: 50%; background: #203C5A; box-shadow: 0 0 10px rgba(40,110,220,0.18)"></span>
    <span aria-hidden="true" style="position: absolute; left: -4px; bottom: -4px; width: 7px; height: 7px; border-radius: 50%; background: #203C5A; box-shadow: 0 0 10px rgba(40,110,220,0.18)"></span>
    <span aria-hidden="true" style="position: absolute; right: -4px; bottom: -4px; width: 7px; height: 7px; border-radius: 50%; background: #203C5A; box-shadow: 0 0 10px rgba(40,110,220,0.18)"></span>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 118px">
      <div>
        <div style="height: 42px; box-sizing: border-box; display: flex; align-items: center; padding: 0 14px; border-bottom: 1px solid rgba(31,95,175,0.32); font-family: 'VT323', monospace; font-size: 21px; letter-spacing: 0.12em; color: #183654; text-shadow: 0 0 0.6px rgba(20,70,150,0.5), 0 0 14px rgba(31,95,175,0.176)">CHANNEL OPEN</div>
        <div style="padding: 8px 14px; border-bottom: 1px solid rgba(31,95,175,0.2); font-family: 'VT323', monospace; letter-spacing: 0.08em">
          <div style="font-size: 15px; color: #5A7087">BASE</div>
          <div style="font-size: 19px; color: #183654">BUENOS AIRES</div>
        </div>
        <div style="padding: 8px 14px; border-bottom: 1px solid rgba(31,95,175,0.2); font-family: 'VT323', monospace; letter-spacing: 0.08em">
          <div style="font-size: 15px; color: #5A7087">TIME</div>
          <div style="font-size: 19px; color: #183654">GMT-3</div>
        </div>
        <a href="https://github.com/mssegosende" style="display: block; padding: 8px 14px; font-family: 'VT323', monospace; letter-spacing: 0.08em; text-decoration: none">
          <div style="font-size: 15px; color: #5A7087">GITHUB</div>
          <div style="font-size: 19px; color: #183654">MSSEGOSENDE &gt;</div>
        </a>
      </div>
      <div aria-hidden="true" style="position: relative; border-left: 1px solid rgba(31,95,175,0.32); background-image: linear-gradient(rgba(31,95,175,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(31,95,175,0.08) 1px, transparent 1px); background-size: 14px 14px; overflow: hidden">
        <span style="position: absolute; left: 50%; top: 50%; width: 84px; height: 84px; margin: -42px 0 0 -42px; border: 1.5px solid #26425F; border-radius: 50%; box-shadow: 0 0 10px rgba(40,110,220,0.18)"></span>
        <span style="position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border: 1px solid rgba(31,95,175,0.48); border-radius: 50%"></span>
        <span style="position: absolute; left: 50%; top: 50%; width: 42px; height: 2px; margin-top: -1px; transform-origin: 0 50%; transform: rotate({{sweep}}deg); background: linear-gradient(90deg, #183654, rgba(31,95,175,0.0)); box-shadow: 0 0 10px rgba(40,110,220,0.18)"></span>
        <span style="position: absolute; left: {{bx}}px; top: {{by}}px; width: 6px; height: 6px; border-radius: 50%; background: #F472B6; box-shadow: 0 0 8px #F472B6; opacity: {{blip}}"></span>
        <span style="position: absolute; right: 6px; bottom: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #26425F">[ba.ar]</span>
      </div>
    </div>
  </div>

  <footer style="position: absolute; left: 20px; right: 20px; bottom: 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 16px; border-top: 1px solid rgba(31,95,175,0.36); font-family: 'VT323', monospace; font-size: 18px; letter-spacing: 0.14em; color: #445C76">
    <span style="font-family: 'Michroma', sans-serif; font-size: 14px; color: #163452; text-shadow: 0 0 0.6px rgba(20,70,150,0.5), 0 0 14px rgba(31,95,175,0.176)">MSSE://</span>
    <span style="display: flex; gap: 24px"><a href="https://github.com/mssegosende" style="text-decoration: none">GITHUB</a><a href="#" style="text-decoration: none">LINKEDIN</a></span>
    <span>© 2026 MARÍA SOL GOSENDE</span>
  </footer>

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(10,40,90,0.05) 0px, rgba(10,40,90,0.05) 1px, transparent 1px, transparent 3px)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1420}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0 }; }
  componentDidMount() { this.t0 = Date.now(); this.timer = setInterval(() => this.setState({ t: Date.now() - this.t0 }), 80); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const t = this.state.t;
    let d = '';
    for (let x = 0; x <= 348; x += 3) {
      const y = 25 + 15 * Math.sin(x * 0.07 + t * 0.005) * (0.5 + 0.5 * Math.sin(x * 0.018 - t * 0.0016));
      d += (x === 0 ? 'M' : 'L') + x + ' ' + y.toFixed(1) + ' ';
    }
    const L1 = 'channel open';
    const L2 = 'waiting for your message';
    const cycle = t % 9000;
    const n1 = Math.min(L1.length, Math.floor(cycle / 55));
    const n2 = Math.max(0, Math.min(L2.length, Math.floor((cycle - 900) / 55)));
    const glitch = (t % 2800) < 160;
    const sweep = (t * 0.12) % 360;
    const ang = 300 * Math.PI / 180;
    const diff = ((sweep - 300) % 360 + 360) % 360;
    return {
      wave: d,
      l1: L1.slice(0, n1),
      l2: L2.slice(0, n2),
      cur: Math.floor(t / 450) % 2 ? 1 : 0,
      dot: Math.floor(t / 700) % 2 ? 1 : 0.35,
      ga: glitch ? -4 : -1.5,
      gb: glitch ? 5 : 1.5,
      sweep: sweep,
      bx: 59 + Math.cos(ang) * 26 - 3,
      by: 50 + Math.sin(ang) * 26 - 3,
      blip: diff < 160 ? (1 - diff / 160) : 0
    };
  }
}
</script>
</body>
</html>
