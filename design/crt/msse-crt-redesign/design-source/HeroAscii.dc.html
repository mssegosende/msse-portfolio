  renderVals() {
    const t = this.state.t;
    if (!this._lines) this._lines = this.art().split("\n");
    const reveal = Math.min(1, t / 2200);
    const shown = Math.floor(this._lines.length * reveal);
    const glitch = (t % 3000) < 220;
    const seed = Math.floor(t / 90);
    const out = this._lines.map((line, j) => {
      if (j > shown) return "";
      if (j === shown) return line.replace(/[^ ]/g, (c, i) => (this.hash(i + seed) > 0.5 ? c : " "));
      if (glitch && this.hash(j * 7.7 + seed) > 0.86) { const n = 2 + Math.floor(this.hash(j + seed) * 18); return (this.hash(j * 3.1 + seed) > 0.5 ? " ".repeat(n) + line : line.slice(n)); }
      return line;
    });
    const bars = [];
    for (let i = 0; i < 46; i++) { const s = Math.sin(i * 91.7) * 43758.5453; const r = s - Math.floor(s); bars.push({ w: r > 0.7 ? 4 : (r > 0.35 ? 2 : 1), h: i % 9 === 0 ? 34 : 28 }); }
    return { ascii: out.join("\n"), scanTop: Math.floor((t * 0.12) % 680), bars: bars };
