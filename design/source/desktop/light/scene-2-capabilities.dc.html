.sink{animation:sink .5s ease .5s forwards}

.draw2{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s cubic-bezier(.65,0,.35,1) 2.3s forwards}

.pose{opacity:0;animation:fade .35s linear 1.35s forwards}
.armL{animation:armL 4.2s ease-in-out infinite}

.dock{opacity:0;transform:translateY(16px);animation:rise .6s ease 1.6s forwards}

<script type="text/x-dc" data-dc-script data-props='{"beat":{"editor":"enum","options":["c1","c2","c3","end"],"default":"c1","section":"Scene"},"robotScale":{"editor":"range","min":1,"max":4,"step":0.05,"default":1.8,"section":"Sizes"},"cardW":{"editor":"range","min":260,"max":400,"step":4,"default":324,"unit":"px","section":"Sizes"},"cardScale":{"editor":"range","min":0.8,"max":1.5,"step":0.02,"default":1,"section":"Sizes"},"robotLayer":{"editor":"enum","options":["front","behind"],"default":"front","section":"Scene"},"autoplay":{"editor":"boolean","default":true,"section":"Scene"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._order = ['c1', 'c2', 'c3', 'end'];
    this._tick = setInterval(() => {
      const st = this.state || {};
      const cur = st.beat || this.props.beat || 'c1';
      if (cur === 'end') {
        // after the menu appears, the cards change by themselves
        const idx = st.endIdx ?? 2;
        this.setState({ endIdx: (idx + 1) % 3, endPrev: idx });
        return;
      }
      // before that, the scroll drives the change (here simulated by autoplay or the mouse wheel)
      const auto = st.auto !== undefined ? st.auto : (this.props.autoplay ?? true);
      if (!auto) return;
      this.setState({ beat: this._order[this._order.indexOf(cur) + 1], endIdx: undefined, endPrev: undefined });
    }, 4800);
  }
  componentWillUnmount() { clearInterval(this._tick); if (this._raf) cancelAnimationFrame(this._raf); }
  renderVals() {
    const RATIO = 1640 / 1043, VW = 1440;
    const beat = (this.state && this.state.beat) || this.props.beat || 'c1';
    const scale = this.props.robotScale ?? 1.8;
    const cz = this.props.cardScale ?? 1;
    const cardW = this.props.cardW ?? 324;
    const W = Math.round(1500 * scale), H = W / RATIO;
    // one fixed shot: the head (exaggerated framing); cards add up one by one in the bottom row
    const head = { p: [0.463, 0.252], s: [840, 302] };  // clear of the card on the left
    const data = [
      { num: 'Ø1', part: 'MIND', small: 'THE MIND', title: 'AI ENGINEERING',
        body: 'The part that thinks. Models that read, reason and decide — LangGraph agents where every step has a typed contract and a defined way to fail, measured with evals.',
        chips: ['LangGraph', 'LangChain', 'RAG', 'Evals'] },
      { num: 'Ø2', part: 'NERVES', small: 'THE NERVOUS SYSTEM', title: 'BACKEND',
        body: 'Unseen, it carries every signal. APIs are the nerves, services the organs, the database the memory — Python and FastAPI, the domain never tied to the framework.',
        chips: ['Python', 'FastAPI', 'PostgreSQL', 'Node'] },
      { num: 'Ø3', part: 'BODY', small: 'THE BODY', title: 'FRONTEND',
        body: 'What you see and touch. HTML is the skeleton, CSS the skin, JavaScript the muscles that move it — React and TypeScript, with Zod at the boundaries.',
        chips: ['React', 'TypeScript', 'Next.js', 'Zod', 'GSAP'] }
    ];
    let rb, cards = [];
    // one camera for the whole scene: the giant head, always moving (idle sway + mouse)
    rb = { left: Math.round(head.s[0] - head.p[0] * W), top: Math.round(-0.0938 * H), w: W,  // same crop of the crown at any size
           h: Math.round(H), flip: 1, op: 1 };
    {
      // vertical card, one at a time, each new one rising on top of the previous, which fades out underneath
      const ch = Math.round(cardW / 0.70), M = 110, BOTTOM = 176;   // centred between the title and the signature, a bit in from the edge
      const one = (d, cls) => Object.assign({ key: d.num, cls, cw: cardW, ch, zoom: cz,
        cxz: Math.round(M / cz), bz: Math.round(BOTTOM / cz) }, d);
      if (beat !== 'end') {
        const n = { c1: 1, c2: 2, c3: 3 }[beat];
        cards = (n > 1 ? [one(data[n - 2], 'sink')] : []).concat([one(data[n - 1], 'rise')]);
      } else {
        const st = this.state || {};
        const idx = st.endIdx ?? 2, prev = st.endPrev;
        cards = (prev !== undefined ? [one(data[prev], 'sink')] : []).concat([one(data[idx], 'rise')]);
      }
    }
    const order = ['c1', 'c2', 'c3', 'end'], labels = ['01', '02', '03', 'END'];
    const auto = (this.state && this.state.auto !== undefined) ? this.state.auto : (this.props.autoplay ?? true);
    const mv = (this.state && this.state.mv) || { x: 0, y: 0 };
    const par = { x: Math.round(-mv.x * 14), y: Math.round(-mv.y * 8) };
    const onMove = (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      this._mv = { x: ((e.clientX - r.left) / r.width) * 2 - 1, y: ((e.clientY - r.top) / r.height) * 2 - 1 };
      if (!this._raf) this._raf = requestAnimationFrame(() => { this._raf = null; this.setState({ mv: this._mv }); });
    };
    const toggleAuto = () => this.setState({ auto: !auto });
    const onWheel = (e) => {
      const now = Date.now();
      if (Math.abs(e.deltaY) < 8 || (this._lastWheel && now - this._lastWheel < 900)) return;
      this._lastWheel = now;
      const i = order.indexOf(beat), j = Math.max(0, Math.min(order.length - 1, i + (e.deltaY > 0 ? 1 : -1)));
      if (j !== i) this.setState({ beat: order[j], auto: false, endIdx: undefined, endPrev: undefined });
    };
    // site index: the five sections 1–5; the active one opens its steps (2.1 2.2 2.3)
    const goTo = (b) => () => this.setState({ beat: b, auto: false, endIdx: undefined, endPrev: undefined });
    const sec = (label, name, active, go) => ({ label: 'Ø' + label, aria: name, h: 40, size: 15, on: active ? 'true' : 'false',
      color: active ? '#FFFFFF' : 'rgba(255,255,255,0.5)', weight: active ? 600 : 400, cursor: go ? 'pointer' : 'default', go: go || (() => {}) });
    const sub = (n, b) => ({ label: 'Ø2.' + n, aria: 'Step 2.' + n, h: 30, size: 12, on: b === beat ? 'true' : 'false',
      color: b === beat ? '#FFFFFF' : 'rgba(255,255,255,0.5)', weight: b === beat ? 600 : 400, cursor: 'pointer', go: goTo(b) });
    const beats = [sec('1', 'Hero'), sec('2', 'Capabilities', true, goTo('end')), sub(1, 'c1'), sub(2, 'c2'), sub(3, 'c3'),
      sec('3', 'Projects'), sec('4', 'About'), sec('5', 'Contact')].map((x, i) => Object.assign({ key: i }, x));
    return { rb, beats, par, onMove, onWheel, toggleAuto, autoOn: auto ? 'true' : 'false', autoLabel: auto ? 'PAUSE' : 'AUTO', isPart: beat !== 'end', isEnd: beat === 'end',
             cards, moving: false, cardW, cardH: Math.round(cardW / 0.70), robotZ: (this.props.robotLayer || 'front') === 'front' ? 6 : 1, layerLabel: (this.props.robotLayer || 'front') === 'front' ? 'IN FRONT OF' : 'BEHIND' };
  }
}
</script>
