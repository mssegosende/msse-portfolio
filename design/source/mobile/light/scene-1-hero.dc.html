<style>
body{margin:0}
a{color:#14181D}
.grain{background-image:url(../../../assets/grain.png);background-size:220px 220px}
.mq{animation:mq 38s linear infinite}
.mq2{animation:mq2 46s linear infinite}
@keyframes mq2{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.idle{animation:idle 7s ease-in-out infinite;transform-origin:50% 60%}
.approach{animation:approach 1.8s cubic-bezier(.25,.6,.2,1) .2s both;transform-origin:50% 40%}
@keyframes approach{from{transform:translate(70px,90px) scale(0.55);opacity:0.4}to{transform:none;opacity:1}}
.hint{animation:hint 1.8s ease-in-out infinite;transform-origin:top}
@keyframes hint{0%,100%{transform:scaleY(0.35)}50%{transform:scaleY(1)}}
@keyframes idle{0%,100%{transform:translate(0,0) rotate(0deg)}30%{transform:translate(-4px,-6px) rotate(-0.6deg)}65%{transform:translate(3px,-2px) rotate(0.5deg)}}
@media (prefers-reduced-motion: reduce){.mq,.mq2,.idle,.approach,.hint{animation:none}}
</style>
</helmet>
<div style="position: relative; height: 844px; overflow: hidden; background: linear-gradient(180deg, #EEF1F4 0%, #C2C9D0 55%, #7D8893 100%); color: #14181D; font-family: Inter, system-ui, sans-serif">
