name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # On main a newer push queues instead: cancelling would cut a deploy mid-upload.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # Takes the version from packageManager in frontend/package.json.
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build
        env:
          # Baked into the bundle at build time.
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}

      - uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: frontend/coverage
          retention-days: 7

      - run: pnpm exec playwright install --with-deps chromium
      # scenes.spec loads the real Spline scenes, so this step needs the network.
      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      # The deploy publishes this exact build, the one the e2e suite just ran on.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: frontend/dist
          retention-days: 1

  deploy:
    needs: frontend
    # Off until the AWS stack (infra/aws/hosting.yml) exists and its outputs are set
    # as repository variables.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      BUCKET: ${{ vars.AWS_SITE_BUCKET }}
      IMMUTABLE: public, max-age=31536000, immutable
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed assets first, so the new index.html never points at a file that
      # isn't there yet. Old ones are kept: a tab opened before the deploy still
      # lazy-loads its chunks. The .wasm files get their type explicitly, or the
      # browser won't compile them while streaming.
      - name: Upload to S3
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" --exclude "*.wasm" --cache-control "$IMMUTABLE"
          aws s3 cp dist/assets "s3://$BUCKET/assets" --recursive --exclude "*" --include "*.wasm" \
            --content-type application/wasm --cache-control "$IMMUTABLE"
          aws s3 sync dist "s3://$BUCKET" --exclude "assets/*" --delete --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
